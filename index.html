<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Fakhama Travel | Luxury Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= HERO ================= -->


<section class="hero">


<img 
src="assets/hero.jpg"
class="hero-bg"
alt="Masjid Nabawi">


<div class="hero-dark"></div>


<div class="hero-content">


<img
src="assets/logo.png"
class="main-logo"
alt="Al Fakhama">


<h1>
AL FAKHAMA
</h1>


<h2>
Luxury Hotel Booking
</h2>


<p>
Premium Hotels • Umrah Services • Luxury Transfers
</p>


<a href="#booking" class="gold-btn">
START BOOKING
</a>


</div>


</section>




<!-- ================= BOOKING ================= -->


<section id="booking" class="booking">


<div class="container">


<div class="title">

<h2>
Hotel Booking
</h2>


<p>
Choose your hotel and room details
</p>


</div>



<div class="booking-box">



<!-- Destination -->


<div class="field">

<label>
Destination
</label>


<select id="destination">

<option>
Select City
</option>


<option>
Madinah
</option>


<option>
Makkah
</option>


</select>

</div>




<!-- Hotel -->


<div class="field">

<label>
Hotel
</label>


<select id="hotel">


<option>
Select Hotel
</option>


</select>


</div>





<!-- Hotel Image -->


<div class="hotel-card">


<img
src="assets/hotel-placeholder.jpg"
id="hotelImage"
alt="Hotel">


<div>

<h3 id="hotelName">
Hotel Name
</h3>


<p>
Luxury Stay
</p>

</div>


</div>





<!-- Dates -->


<div class="field">


<label>
Check In
</label>


<input 
type="date"
id="checkIn">


</div>





<div class="field">


<label>
Check Out
</label>


<input
type="date"
id="checkOut">


</div>





<!-- Nights -->


<div class="field">


<label>
Nights
</label>


<input
type="number"
id="nights"
readonly>


</div>





<!-- Rooms -->


<div class="field">


<label>
Rooms
</label>


<input
type="number"
id="rooms"
value="1"
min="1">


</div>
