<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Al Fakhama Travel | Luxury Booking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= HERO ================= -->


<section class="hero">


<img 
src="assets/hero.jpg"
class="hero-bg"
alt="Masjid Nabawi">


<div class="hero-dark"></div>


<div class="hero-content">


<img
src="assets/logo.png"
class="main-logo"
alt="Al Fakhama">


<h1>
AL FAKHAMA
</h1>


<h2>
Luxury Hotel Booking
</h2>


<p>
Premium Hotels • Umrah Services • Luxury Transfers
</p>


<a href="#booking" class="gold-btn">
START BOOKING
</a>


</div>


</section>




<!-- ================= BOOKING ================= -->


<section id="booking" class="booking">


<div class="container">


<div class="title">

<h2>
Hotel Booking
</h2>


<p>
Choose your hotel and room details
</p>


</div>



<div class="booking-box">



<!-- Destination -->


<div class="field">

<label>
Destination
</label>


<select id="destination">

<option>
Select City
</option>


<option>
Madinah
</option>


<option>
Makkah
</option>


</select>

</div>




<!-- Hotel -->


<div class="field">

<label>
Hotel
</label>


<select id="hotel">


<option>
Select Hotel
</option>


</select>


</div>





<!-- Hotel Image -->


<div class="hotel-card">


<img
src="assets/hotel-placeholder.jpg"
id="hotelImage"
alt="Hotel">


<div>

<h3 id="hotelName">
Hotel Name
</h3>


<p>
Luxury Stay
</p>

</div>


</div>





<!-- Dates -->


<div class="field">


<label>
Check In
</label>


<input 
type="date"
id="checkIn">


</div>





<div class="field">


<label>
Check Out
</label>


<input
type="date"
id="checkOut">


</div>





<!-- Nights -->


<div class="field">


<label>
Nights
</label>


<input
type="number"
id="nights"
readonly>


</div>





<!-- Rooms -->


<div class="field">


<label>
Rooms
</label>


<input
type="number"
id="rooms"
value="1"
min="1">


</div>
<!-- Room Type -->

<div class="field">

<label>Room Type</label>

<select id="roomType">

<option value="standard">Standard Room</option>

<option value="suite">Suite Room</option>

</select>

</div>

<!-- Occupancy -->

<div class="field">

<label>Occupancy</label>

<select id="occupancy">

<option value="double">Double</option>

<option value="triple">Triple</option>

<option value="quad">Quad</option>

</select>

</div>

<!-- Adults -->

<div class="field">

<label>Adults</label>

<input
type="number"
id="adults"
value="2"
min="1"
max="10">

</div>

<!-- Children -->

<div class="field">

<label>Children</label>

<input
type="number"
id="children"
value="0"
min="0"
max="10">

</div>

<!-- Extra Bed -->

<div class="field">

<label>Extra Bed</label>

<select id="extraBed">

<option value="0">No Extra Bed</option>

<option value="1">1 Extra Bed</option>

<option value="2">2 Extra Beds</option>

<option value="3">3 Extra Beds</option>

</select>

</div>

<!-- Meal Plan -->

<div class="field">

<label>Meal Plan</label>

<select id="mealPlan">

<option value="BB">BB (Breakfast)</option>

<option value="HB">HB (Breakfast + Dinner)</option>

</select>

</div>

<!-- Room View -->

<div class="field">

<label>Room View</label>

<select id="roomView">

<option>Standard View</option>

<option>City View</option>

<option>Haram View</option>

</select>

</div>

</div>

</div>

</section>
<!-- ================= TRANSFER ================= -->

<section class="booking">

<div class="container">

<div class="title">

<h2>
Transfer
</h2>

<p>
Optional Luxury Transfer Service
</p>

</div>

<div class="booking-box">

<div class="field">

<label>Need Transfer?</label>

<select id="needTransfer">

<option value="no">No</option>

<option value="yes">Yes</option>

</select>

</div>

<div class="field">

<label>From</label>

<select id="transferFrom">

<option>Madinah Airport</option>
<option>Makkah Hotel</option>
<option>Jeddah Airport</option>
<option>Hotel</option>

</select>

</div>

<div class="field">

<label>To</label>

<select id="transferTo">

<option>Hotel</option>
<option>Madinah Airport</option>
<option>Makkah Hotel</option>
<option>Jeddah Airport</option>

</select>

</div>

<div class="field">

<label>Vehicle</label>

<select id="vehicle">

<option>GMC Yukon</option>
<option>Staria</option>
<option>Hiace</option>
<option>Coaster</option>
<option>Bus</option>

</select>

</div>

<div class="field">

<label>Date</label>

<input type="date" id="transferDate">

</div>

<div class="field">

<label>Time</label>

<input type="time" id="transferTime">

</div>

</div>

</div>

</section>

<!-- ================= GUEST ================= -->

<section class="booking">

<div class="container">

<div class="title">

<h2>

Guest Details

</h2>

<p>

Passenger Information

</p>

</div>

<div class="booking-box">

<div class="field">

<label>Full Name</label>

<input
type="text"
id="fullname">

</div>

<div class="field">

<label>Passport Number</label>

<input
type="text"
id="passport">

</div>

<div class="field">

<label>Nationality</label>

<input
type="text"
value="Uzbekistan"
id="nationality">

</div>

<div class="field">

<label>WhatsApp</label>

<input
type="tel"
id="phone">

</div>

<div class="field">

<label>Email</label>

<input
type="email"
id="email">

</div>

<div class="field">

<label>Special Request</label>

<textarea
id="note"
rows="5"></textarea>

</div>

</div>

</div>

</section>
