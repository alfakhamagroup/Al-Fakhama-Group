<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Al Fakhama Travel — Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f1e9;
color:#30271c;
}

header{
background:linear-gradient(135deg,#1d1812,#735936);
color:white;
padding:22px;
}

.nav{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}

.logo{
font-size:21px;
font-weight:bold;
letter-spacing:2px;
}

.back{
background:#fff;
color:#30271c;
}

.container{
max-width:1200px;
margin:30px auto;
padding:0 18px;
}

.card{
background:#fff;
border-radius:20px;
padding:28px;
margin-bottom:25px;
box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:25px;
}

.tabs button{
background:#eee5d7;
color:#5b4529;
}

.tabs button.active{
background:#b58b4e;
color:white;
}

.panel{
display:none;
}

.panel.active{
display:block;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.full{
grid-column:1/-1;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #ded1bd;
border-radius:10px;
background:#fffdf9;
font-size:15px;
}

label{
font-size:13px;
font-weight:bold;
display:block;
margin-bottom:6px;
}

.primary{
background:linear-gradient(135deg,#ae8445,#d5b36f);
color:white;
width:100%;
padding:14px;
margin-top:10px;
}

.danger{
background:#29231c;
color:white;
}

.delete{
background:#ffe1e1;
color:#a02828;
}

.item{
background:#fffdf9;
border:1px solid #e3d8c8;
border-radius:15px;
padding:20px;
margin:15px 0;
}

.item h3{
margin-top:0;
color:#76582e;
}

.price{
font-size:18px;
font-weight:bold;
color:#9a7133;
}

.section{
background:#faf6ef;
border-radius:15px;
padding:20px;
margin-top:20px;
}

.section h3{
margin-top:0;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
background:#eee3d1;
font-size:12px;
margin:3px;
}

.status{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
background:#e8edf8;
color:#315a9b;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.stat{
background:#faf6ef;
padding:20px;
border-radius:15px;
text-align:center;
}

.stat strong{
display:block;
font-size:28px;
color:#9b7439;
margin-bottom:5px;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.card{
padding:20px;
}

.nav{
align-items:flex-start;
flex-direction:column;
}

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
AL FAKHAMA TRAVEL — ADMIN
</div>

<button class="back"
onclick="location.href='index.html'">
BACK TO BOOKING
</button>

</div>

</header>


<div class="container">

<div class="card">

<h2>Luxury Booking Management</h2>

<div class="stats">

<div class="stat">
<strong id="totalBookings">0</strong>
Bookings
</div>

<div class="stat">
<strong id="newBookings">0</strong>
New
</div>

<div class="stat">
<strong id="confirmedBookings">0</strong>
Confirmed
</div>

<div class="stat">
<strong id="cancelledBookings">0</strong>
Cancelled
</div>

</div>


<div class="tabs">

<button class="active"
onclick="openTab('bookings',this)">
BOOKINGS
</button>

<button
onclick="openTab('hotels',this)">
HOTELS
</button>

<button
onclick="openTab('rooms',this)">
ROOM TYPES
</button>

<button
onclick="openTab('views',this)">
VIEWS
</button>

<button
onclick="openTab('extra',this)">
EXTRA BED
</button>

<button
onclick="openTab('transfers',this)">
TRANSFERS
</button>

</div>


<!-- BOOKINGS -->

<div id="bookings" class="panel active">

<input
id="search"
placeholder="Search booking..."
oninput="renderBookings()">

</div>


<!-- HOTELS -->

<div id="hotels" class="panel">

<div class="section">

<h3>Add Hotel</h3>

<div class="grid">

<div>

<label>Destination</label>

<select id="hotelDestination">

<option>Makkah</option>

</select>

</div>

<div>

<label>Hotel Name</label>

<input
id="hotelName"
placeholder="Enter hotel name">

</div>

<button
class="primary"

<h3>Add Room Type</h3>

<div>

<label>Destination</label>

<select id="roomDestination"
onchange="loadRoomHotels()">

</div>

<div>

<div>

<input
id="roomQuad"
type="number"
placeholder="0">

</div>

<button
class="primary"
onclick="saveRoomType()">

SAVE ROOM TYPE

<!-- VIEWS -->

<div id="views" class="panel">

<div class="section">

<h3>Add View</h3>

<div class="grid">

<div>

<label>Destination</label>

<select id="viewDestination"
onchange="loadViewHotels()">

<option>Madinah</option>

<option>Makkah</option>

</select>

</div>

<div>

<label>Hotel</label>

<select id="viewHotel"></select>

</div>

<div>

<label>View Name</label>

<select id="viewName">

<option>City View</option>

<option>Haram View</option>

<option>Kaaba View</option>

</select>

</div>

<div>

<label>View Price — SAR</label>

<input
id="viewPrice"

placeholder="0">

</div>

<button
class="primary"
onclick="saveView()">

</button>

</div>


<div id="viewList"></div>

</div>


<!-- EXTRA BED -->

<div id="extra" class="panel">

<div class="section">

<h3>Extra Bed Management</h3>

<div class="grid">

<div>

<label>Destination</label>

<select id="extraDestination"
onchange="loadExtraHotels()">

<option>Madinah</option>

<option>Makkah</option>

</select>

</div>

<div>

<label>Hotel</label>

<select id="extraHotel"></select>

</div>

<div>

<label>Extra Bed Price — SAR</label>

<input
id="extraPrice"
type="number"
placeholder="Example: 150">

</div>

<!-- TRANSFERS -->

<div id="transfers" class="panel">

<div class="section">

<h3>Transfer Price</h3>

<div class="grid">

<div>

<label>Route</label>

<select id="transferRoute"></select>

</div>

<div>

<label>Vehicle</label>

<select id="transferVehicle"></select>

</div>

<div>

<label>Price — SAR</label>

<input
id="transferPrice"
type="number"
placeholder="0">

</div>

</div>

<button
class="primary"
onclick="saveTransfer()">

SAVE TRANSFER PRICE

</button>

</div>


<div class="section">

<h3>Add Vehicle</h3>

<div class="grid">

<input
id="vehicleName"
placeholder="Example: GMC Yukon 2025">

<button
class="primary"
onclick="addVehicle()">

ADD VEHICLE

</button>

</div>

</div>


<div id="transferList"></div>

</div>


</div>

</div>


<script>

const API =
"https://al-fakhama-booking-new.alfakhama-travel-uzb.workers.dev";


let appData={
hotels:{},
roomTypes:{},
views:{},
extraBeds:{},
transfers:{},
vehicles:[],
routes:{},
bookings:[]
};


async function api(
url,
options={}
){

const response =
await fetch(
API+url,
{
...options,
headers:{
"Content-Type":
"application/json",
...(options.headers||{})
}
}
);

if(!response.ok){

throw new Error(
"Server Error "+
response.status
);

}

return response.json();

}


async function loadData(){

try{

const data =
await api("/api/data");

appData.hotels =
data.hotels||{};

appData.roomTypes =
data.roomTypes||{};

appData.views =
data.views||{};

appData.extraBeds =
data.extraBeds||{};

appData.transfers =
data.transfers||{};

appData.vehicles =
data.vehicles||[];

appData.routes =
data.routes||{};


const bookings =
await api("/api/bookings");

appData.bookings =
Array.isArray(bookings)
?bookings
:[];


renderAll();

}catch(error){

console.error(error);

alert(
"Could not load Admin data."
);

}

}


function openTab(
id,
button
){

document
.querySelectorAll(".panel")
.forEach(
x=>x.classList.remove("active")
);

document
.querySelectorAll(".tabs button")
.forEach(
x=>x.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

button.classList.add("active");

}


function renderAll(){

renderBookings();

renderHotels();

loadRoomHotels();

renderRooms();

loadViewHotels();

renderViews();

loadExtraHotels();

renderExtraBeds();

loadTransferRoutes();

loadTransferVehicles();

renderTransfers();

}


function renderBookings(){

const list =
document.getElementById(
"bookingList"
);

const search =
(
document.getElementById(
"search"
).value||""
).toLowerCase();


const data =
appData.bookings||[];


const filtered =
data.filter(x=>

(x.name||"")
.toLowerCase()
.includes(search)||

(x.phone||"")
.toLowerCase()
.includes(search)||

(x.hotel||"")
.toLowerCase()
.includes(search)||

(x.passport||"")
.toLowerCase()
.includes(search)

);


document.getElementById(
"totalBookings"
).innerText =
data.length;


document.getElementById(
"newBookings"
).innerText =
data.filter(
x=>x.status==="New"
).length;


document.getElementById(
"confirmedBookings"
).innerText =
data.filter(
x=>x.status==="Confirmed"
).length;


document.getElementById(
"cancelledBookings"
).innerText =
data.filter(
x=>x.status==="Cancelled"
).length;


if(!filtered.length){

list.innerHTML =
"<p>No bookings found.</p>";

return;

}


list.innerHTML =
filtered.map(x=>`

<div class="item">

<h3>
${x.name||"-"}
</h3>

<span class="status">
${x.status||"New"}
</span>

<p>

<strong>Passport:</strong>
${x.passport||"-"}

<br>

<strong>Phone:</strong>
${x.phone||"-"}

<br>

<strong>Email:</strong>
${x.email||"-"}

<br>

<strong>Destination:</strong>
${x.destination||"-"}

<br>

<strong>Hotel:</strong>
${x.hotel||"-"}

<br>

<strong>Room Type:</strong>
${x.roomType||x.room||"-"}

<br>

<strong>Room Category:</strong>
${x.roomCategory||"-"}

<br>

<strong>View:</strong>
${x.view||"-"}

<br>

<strong>Extra Bed:</strong>
${x.extraBed||"No"}

<br>

<strong>Dates:</strong>
${x.checkin||"-"}
→
${x.checkout||"-"}

<br>

<strong>Transfer:</strong>
${x.transferRoute||"No Transfer"}

<br>

<strong>Vehicle:</strong>
${x.vehicle||"-"}

<br>

<strong>Total:</strong>
${x.total||"0 SAR"}

</p>

<div class="actions">

<button
class="confirm"
onclick="statusBooking(
'${x.id}',
'Confirmed'
)">

CONFIRM

</button>

<button
class="cancel"
onclick="statusBooking(
'${x.id}',
'Cancelled'
)">

CANCEL

</button>

<button
class="delete"
onclick="deleteBooking(
'${x.id}'
)">

DELETE

</button>

</div>

</div>

`).join("");

}


async function statusBooking(
id,
status
){

await api(
"/api/bookings/"+id,
{
method:"PUT",
body:
JSON.stringify({
status
})
}
);

await loadData();

}


async function deleteBooking(
id
){

if(
!confirm(
"Delete this booking?"
)
)return;

await api(
"/api/bookings/"+id,
{
method:"DELETE"
}
);

await loadData();

}


async function saveHotel(){

const destination =
document.getElementById(
"hotelDestination"
).value;

const name =
document.getElementById(
"hotelName"
).value.trim();


if(!name){

alert(
"Enter hotel name."
);

return;

}


await api(
"/api/hotels",
{
method:"POST",
body:
JSON.stringify({
destination,
name
})
}
);

alert(
"Hotel saved."
);

document.getElementById(
"hotelName"
).value="";

await loadData();

}


function renderHotels(){

const list =
document.getElementById(
"hotelList"
);

let html="";


Object.keys(
appData.hotels
).forEach(
destination=>{

html+=
`<h3>${destination}</h3>`;


Object.keys(
appData.hotels[
destination
]||{}
).forEach(
hotel=>{

html+=`

<div class="item">

<h3>
${hotel}
</h3>

<span class="badge">
${destination}
</span>

<button
class="delete"
onclick="deleteHotel(
'${encodeURIComponent(destination)}',
'${encodeURIComponent(hotel)}'
)">

DELETE HOTEL

</button>

</div>

`;

});

});


list.innerHTML =
html||
"<p>No hotels added.</p>";

}


async function deleteHotel(
destination,
hotel
){

if(
!confirm(
"Delete this hotel?"
)
)return;


await api(
"/api/hotels",
{
method:"DELETE",
body:
JSON.stringify({

destination:
decodeURIComponent(
destination
),

name:
decodeURIComponent(
hotel
)

})
}
);

await loadData();

}


function loadRoomHotels(){

const destination =
document.getElementById(
"roomDestination"
).value;

const select =
document.getElementById(
"roomHotel"
);

select.innerHTML =
'<option value="">Select Hotel</option>';


Object.keys(
appData.hotels[
destination
]||{}
).forEach(
hotel=>{

const option =
document.createElement(
"option"
);

option.value=hotel;

option.textContent=hotel;

select.appendChild(
option
);

});

}


async function saveRoomType(){

const destination =
document.getElementById(
"roomDestination"
).value;

const hotel =
document.getElementById(
"roomHotel"
).value;

const name =
document.getElementById(
"roomTypeName"
).value.trim();

const Double =
Number(
document.getElementById(
"roomDouble"
).value
)||0;

const Triple =
Number(
document.getElementById(
"roomTriple"
).value
)||0;

const Quad =
Number(
document.getElementById(
"roomQuad"
).value
)||0;


if(!hotel||!name){

alert(
"Select hotel and enter room type."
);

return;

}


await api(
"/api/room-types",
{
method:"POST",
body:
JSON.stringify({
destination,
hotel,
name,
Double,
Triple,
Quad
})
}
);

alert(
"Room type saved."
);

await loadData();

}


function renderRooms(){

const list =
document.getElementById(
"roomList"
);

let html="";


Object.keys(
appData.roomTypes
).forEach(key=>{

const parts =
key.split("|");

html+=
`<h3>${parts[0]} — ${parts[1]}</h3>`;


(
appData.roomTypes[key]||[]
).forEach(room=>{

html+=`

<div class="item">

<h3>
${room.name}
</h3>

<p>

Double:
<span class="price">
${room.Double} SAR
</span>

<br>

Triple:
<span class="price">
${room.Triple} SAR
</span>

<br>

Quad:
<span class="price">
${room.Quad} SAR
</span>

</p>

<button
class="delete"
onclick="deleteRoom(
'${encodeURIComponent(parts[0])}',
'${encodeURIComponent(parts[1])}',
'${encodeURIComponent(room.name)}'
)">

DELETE

</button>

</div>

`;

});

});


list.innerHTML =
html||
"<p>No room types added.</p>";

}

function loadExtraHotels(){

).value;

);

async function saveExtraBed(){

const destination =
document.getElementById(
"extraDestination"
).value;

const hotel =
document.getElementById(
"extraHotel"
).value;

const price =
Number(
document.getElementById(
"extraPrice"
).value
)||0;

const enabled =
document.getElementById(
"extraEnabled"
).value ===
"true";


if(!hotel){

alert(
"Select hotel."
);

return;

}


await api(
"/api/extra-beds",
{
method:"POST",
body:
JSON.stringify({
destination,
hotel,
price,
enabled
})
}
);

alert(
"Extra Bed saved."
);

await loadData();

}


function renderExtraBeds(){

const list =
document.getElementById(
"extraList"
);

let html="";


Object.keys(
appData.extraBeds
).forEach(key=>{

const parts =
key.split("|");

const x =
appData.extraBeds[key];


html+=`

<div class="item">

<h3>
${parts[0]} — ${parts[1]}
</h3>

<p>

Status:
${x.enabled
?"Available"
:"Not Available"}

<br>

Extra Bed:
<span class="price">
${x.price} SAR
</span>

<br>

Breakfast:
Included ✓

</p>

<button
class="delete"
onclick="deleteExtra(
'${encodeURIComponent(parts[0])}',
'${encodeURIComponent(parts[1])}'
)">

DELETE

</button>

</div>

`;

});


list.innerHTML =
html||
"<p>No Extra Bed settings.</p>";

}


async function deleteExtra(
destination,
hotel
){

if(
!confirm(
"Delete Extra Bed?"
)
)return;


await api(
"/api/extra-beds",
{
method:"DELETE",
body:
JSON.stringify({

destination:
decodeURIComponent(
destination
),

hotel:
decodeURIComponent(
hotel
)

})
}
);

await loadData();

}


function loadTransferRoutes(){

const select =
document.getElementById(
"transferRoute"
);

select.innerHTML =
'<option value="">Select Route</option>';


Object.values(
appData.routes
)
.flat()
.forEach(route=>{

const option =
document.createElement(
"option"
);

option.value=route;

option.textContent=route;

select.appendChild(
option
);

});

}


function loadTransferVehicles(){

const select =
document.getElementById(
"transferVehicle"
);

select.innerHTML =
'<option value="">Select Vehicle</option>';


appData.vehicles
.forEach(vehicle=>{

const option =
document.createElement(
"option"
);

option.value=vehicle;

option.textContent=vehicle;

select.appendChild(
option
);

});

}


async function saveTransfer(){

const route =
document.getElementById(
"transferRoute"
).value;

const vehicle =
document.getElementById(
"transferVehicle"
).value;

const price =
Number(
document.getElementById(
"transferPrice"
).value
)||0;


if(!route||!vehicle){

alert(
"Select route and vehicle."
);

return;

}


await api(
"/api/transfers",
{
method:"POST",
body:
JSON.stringify({
route,
vehicle,
price
})
}
);

alert(
"Transfer price saved."
);

await loadData();

}


async function addVehicle(){

const name =
document.getElementById(
"vehicleName"
).value.trim();


if(!name){

alert(
"Enter vehicle name."
);

return;

}


await api(
"/api/vehicles",
{
method:"POST",
body:
JSON.stringify({
name
})
}
);

alert(
"Vehicle added."
);

document.getElementById(
"vehicleName"
).value="";

await loadData();

}


function renderTransfers(){

const list =
document.getElementById(
"transferList"
);

let html="";


Object.keys(
appData.transfers
).forEach(key=>{

const parts =
key.split("|");

html+=`

<div class="item">

<h3>
${parts[0]}
</h3>

<p>

Vehicle:
${parts.slice(1).join("|")}

<br>

Price:
<span class="price">
${appData.transfers[key]} SAR
</span>

</p>

</div>

`;

});


list.innerHTML =
html||
"<p>No transfer prices added.</p>";

}


loadData();

</script>

</body>
</html>
