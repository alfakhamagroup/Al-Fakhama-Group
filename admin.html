<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al Fakhama Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0e7;font-family:Arial;color:#2b241b}
header{background:#211a12;color:#fff;padding:18px;text-align:center}
.logo{font-size:22px;font-weight:bold;letter-spacing:2px}
.container{max-width:1000px;margin:auto;padding:15px}
.login,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 15px #0001}
.panel{display:none}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
.menu button{border:0;padding:12px 5px;border-radius:8px;background:#eee3d1;font-weight:bold;cursor:pointer}
.menu button.active{background:#ad8549;color:white}
.section{display:none}
.section.active{display:block}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
input,select{width:100%;padding:11px;border:1px solid #d8cbb8;border-radius:7px;margin-top:5px}
label{font-weight:bold;font-size:14px}
.btn{width:100%;padding:12px;border:0;border-radius:7px;background:#ad8549;color:#fff;font-weight:bold;margin-top:12px;cursor:pointer}
.item{background:#faf7f1;border:1px solid #e3d8c7;border-radius:9px;padding:12px;margin-top:10px}
.delete{background:#a33;color:#fff;border:0;border-radius:5px;padding:7px;margin-top:8px}
.success{background:#e0f2e3;padding:10px;border-radius:7px;margin-top:10px}
.error{background:#f8dddd;padding:10px;border-radius:7px;margin-top:10px}
@media(max-width:650px){
.menu{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">AL FAKHAMA TRAVEL</div>
<div>ADMIN PANEL</div>
</header>

<div class="container">

<div class="login" id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="password" placeholder="Admin Password">
<button class="btn" onclick="login()">LOGIN</button>
<div id="loginMessage"></div>
</div>

<div class="panel" id="panel">

<div class="menu">
<button class="active" onclick="openTab('hotels',this)">🏨 Hotels</button>
<button onclick="openTab('rooms',this)">🛏 Rooms</button>
<button onclick="openTab('views',this)">👁 Views</button>
<button onclick="openTab('extra',this)">🛌 Extra Bed</button>
<button onclick="openTab('transfers',this)">🚘 Transfers</button>
<button onclick="openTab('vehicles',this)">🚙 Vehicles</button>
<button onclick="openTab('bookings',this)">📋 Bookings</button>
</div>


<!-- HOTELS -->

<div id="hotels" class="section active">

<h2>🏨 Hotels</h2>

<div class="grid">

<div>
<label>Destination</label>
<select id="hotelDestination">
<option>Madinah</option>
<option>Makkah</option>
</select>
</div>

<div>
<label>Hotel Name</label>
<input id="hotelName" placeholder="Anjum Hotel">
</div>

<div>
<label>Double Price</label>
<input type="number" id="hotelDouble">
</div>

<div>
<label>Triple Price</label>
<input type="number" id="hotelTriple">
</div>

<div>
<label>Quad Price</label>
<input type="number" id="hotelQuad">
</div>

</div>

<button class="btn" onclick="saveHotel()">SAVE HOTEL</button>

<div id="hotelList"></div>

</div>


<!-- ROOM TYPES -->

<div id="rooms" class="section">

<h2>🛏 Room Types</h2>

<p>
Bu yerda <b>Double / Triple / Quad yo‘q</b>.
Faqat tanlangan hotelga kerakli xona turini va narxini qo‘shasiz.
</p>

<div class="grid">

<div>
<label>Destination</label>
<select id="roomDestination">
<option>Madinah</option>
<option>Makkah</option>
</select>
</div>

<div>
<label>Hotel</label>
<select id="roomHotel"></select>
</div>

<div>
<label>Room Type</label>
<input id="roomName" placeholder="Junior Suite">
</div>

<div>
<label>Price SAR</label>
<input type="number" id="roomPrice">
</div>

</div>

<button class="btn" onclick="saveRoom()">ADD ROOM TYPE</button>

<div id="roomList"></div>

</div>


<!-- VIEWS -->

<div id="views" class="section">

<h2>👁 Room Views</h2>

<div class="grid">

<div>
<label>Destination</label>
<select id="viewDestination">
<option>Madinah</option>
<option>Makkah</option>
</select>
</div>

<div>
<label>Hotel</label>
<select id="viewHotel"></select>
</div>

<div>
<label>View Name</label>
<input id="viewName" placeholder="Haram View">
</div>

<div>
<label>Extra Price SAR</label>
<input type="number" id="viewPrice">
</div>

</div>

<button class="btn" onclick="saveView()">ADD VIEW</button>

<div id="viewList"></div>

</div>


<!-- EXTRA BED -->

<div id="extra" class="section">

<h2>🛌 Extra Bed</h2>

<div class="grid">

<div>
<label>Destination</label>
<select id="extraDestination">
<option>Madinah</option>
<option>Makkah</option>
</select>
</div>

<div>
<label>Hotel</label>
<select id="extraHotel"></select>
</div>

<div>
<label>Extra Bed Price SAR</label>
<input type="number" id="extraPrice">
</div>

</div>

<button class="btn" onclick="saveExtra()">SAVE EXTRA BED</button>

<div id="extraList"></div>

</div>


<!-- TRANSFERS -->

<div id="transfers" class="section">

<h2>🚘 Transfers</h2>

<div class="grid">

<div>
<label>Route</label>
<select id="transferRoute"></select>
</div>

<div>
<label>Vehicle</label>
<select id="transferVehicle"></select>
</div>

<div>
<label>Price SAR</label>
<input type="number" id="transferPrice">
</div>

</div>

<button class="btn" onclick="saveTransfer()">SAVE TRANSFER</button>

<div id="transferList"></div>

</div>


<!-- VEHICLES -->

<div id="vehicles" class="section">

<h2>🚙 Vehicles</h2>

<input id="vehicleName" placeholder="Mercedes S-Class 2026">

<button class="btn" onclick="addVehicle()">ADD VEHICLE</button>

<div id="vehicleList"></div>

</div>


<!-- BOOKINGS -->

<div id="bookings" class="section">

<h2>📋 Bookings</h2>

<div id="bookingList">Loading...</div>

</div>

</div>
</div>


<script>

const API="https://al-fakhama-booking-new.alfakhama-travel-uzb.workers.dev";

let DATA={};


/* LOGIN */

function login(){

if(document.getElementById("password").value!=="ALFAKHAMA2026"){

document.getElementById("loginMessage").innerHTML=
'<div class="error">Wrong password</div>';

return;

}

document.getElementById("loginBox").style.display="none";
document.getElementById("panel").style.display="block";

loadData();

}


/* TABS */

function openTab(id,button){

document.querySelectorAll(".section")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".menu button")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

if(id==="bookings")loadBookings();

}


/* API */

async function api(path,options={}){

const r=await fetch(API+path,{
...options,
headers:{
"Content-Type":"application/json",
...(options.headers||{})
}
});

return await r.json();

}


/* LOAD */

async function loadData(){

try{

DATA=await api("/api/data");

renderHotels();
loadAllHotelSelects();
renderRooms();
renderViews();
renderExtra();
loadTransfers();
renderVehicles();

}catch(e){

alert("Worker / KV connection error");

}

}


/* HOTEL */

async function saveHotel(){

const body={
destination:hotelDestination.value,
name:hotelName.value.trim(),
Double:Number(hotelDouble.value)||0,
Triple:Number(hotelTriple.value)||0,
Quad:Number(hotelQuad.value)||0
};

if(!body.name){

alert("Hotel name kiriting");
return;

}

const r=await api("/api/hotels",{
method:"POST",
body:JSON.stringify(body)
});

if(r.success){

alert("Hotel saved");

DATA=await api("/api/data");

renderHotels();
loadAllHotelSelects();

}

}


function renderHotels(){

let html="";

Object.keys(DATA.hotels||{}).forEach(d=>{

Object.keys(DATA.hotels[d]||{}).forEach(h=>{

let x=DATA.hotels[d][h];

html+=`
<div class="item">
<b>${d} — ${h}</b><br>
Double: ${x.Double} SAR<br>
Triple: ${x.Triple} SAR<br>
Quad: ${x.Quad} SAR
<br>
<button class="delete"
onclick="deleteHotel('${d}','${encodeURIComponent(h)}')">
DELETE
</button>
</div>`;

});

});

hotelList.innerHTML=html;

}


async function deleteHotel(d,h){

if(!confirm("Delete hotel?"))return;

await api("/api/hotels",{
method:"DELETE",
body:JSON.stringify({
destination:d,
name:decodeURIComponent(h)
})
});

DATA=await api("/api/data");

renderHotels();
loadAllHotelSelects();

}


/* HOTEL SELECTS */

function fillHotels(id,destination){

let s=document.getElementById(id);

s.innerHTML='<option value="">Select Hotel</option>';

Object.keys(DATA.hotels?.[destination]||{})
.forEach(h=>{

s.innerHTML+=`<option value="${h}">${h}</option>`;

});

}


function loadAllHotelSelects(){

fillHotels("roomHotel",roomDestination.value);
fillHotels("viewHotel",viewDestination.value);
fillHotels("extraHotel",extraDestination.value);

}


roomDestination.onchange=()=>{
fillHotels("roomHotel",roomDestination.value);
renderRooms();
};

viewDestination.onchange=()=>{
fillHotels("viewHotel",viewDestination.value);
renderViews();
};

extraDestination.onchange=()=>{
fillHotels("extraHotel",extraDestination.value);
renderExtra();
};


/* ROOM TYPES */

async function saveRoom(){

const body={
destination:roomDestination.value,
hotel:roomHotel.value,
name:roomName.value.trim(),
price:Number(roomPrice.value)||0
};

if(!body.hotel||!body.name){

alert("Hotel va Room Type kiriting");
return;

}

/*
Worker'dagi room-types endpoint hozir
Double/Triple/Quad formatini qabul qiladi.
Shuning uchun Room Type narxini Double maydoniga saqlaymiz.
*/

await api("/api/room-types",{
method:"POST",
body:JSON.stringify({
destination:body.destination,
hotel:body.hotel,
name:body.name,
Double:body.price,
Triple:0,
Quad:0
})
});

alert("Room Type saved");

DATA=await api("/api/data");

renderRooms();

}


function renderRooms(){

let key=
roomDestination.value+"|"+roomHotel.value;

let list=
DATA.roomTypes?.[key]||[];

let html="";

list.forEach(x=>{

html+=`
<div class="item">
<b>${x.name}</b><br>
Price: ${x.Double||0} SAR
</div>`;

});

roomList.innerHTML=html;

}


/* VIEWS */

async function saveView(){

if(!viewHotel.value||!viewName.value){

alert("Hotel va View kiriting");
return;

}

await api("/api/views",{
method:"POST",
body:JSON.stringify({
destination:viewDestination.value,
hotel:viewHotel.value,
name:viewName.value.trim(),
price:Number(viewPrice.value)||0
})
});

alert("View saved");

DATA=await api("/api/data");

renderViews();

}


function renderViews(){

let key=
viewDestination.value+"|"+viewHotel.value;

let list=
DATA.views?.[key]||[];

viewList.innerHTML=list.map(x=>`

<div class="item">
<b>${x.name}</b><br>
+${x.price} SAR
</div>

`).join("");

}


/* EXTRA BED */

async function saveExtra(){

if(!extraHotel.value){

alert("Hotel tanlang");
return;

}

await api("/api/extra-beds",{
method:"POST",
body:JSON.stringify({
destination:extraDestination.value,
hotel:extraHotel.value,
enabled:true,
price:Number(extraPrice.value)||0
})
});

alert("Extra Bed saved");

DATA=await api("/api/data");

renderExtra();

}


function renderExtra(){

let key=
extraDestination.value+"|"+extraHotel.value;

let x=
DATA.extraBeds?.[key];

if(!x){

extraList.innerHTML=
"<div class='item'>No Extra Bed</div>";

return;

}

extraList.innerHTML=`

<div class="item">
<b>Extra Bed + Breakfast</b><br>
+${x.price} SAR
</div>

`;

}


/* TRANSFERS */

function loadTransfers(){

let routes=[];

Object.values(DATA.routes||{})
.flat()
.forEach(x=>{

if(!routes.includes(x))
routes.push(x);

});

transferRoute.innerHTML=
'<option value="">Select Route</option>';

routes.forEach(x=>{

transferRoute.innerHTML+=
`<option value="${x}">${x}</option>`;

});

transferVehicle.innerHTML=
'<option value="">Select Vehicle</option>';

(DATA.vehicles||[]).forEach(x=>{

transferVehicle.innerHTML+=
`<option value="${x}">${x}</option>`;

});

renderTransfers();

}


async function saveTransfer(){

if(!transferRoute.value||
!transferVehicle.value){

alert("Route va Vehicle tanlang");
return;

}

await api("/api/transfers",{
method:"POST",
body:JSON.stringify({
route:transferRoute.value,
vehicle:transferVehicle.value,
price:Number(transferPrice.value)||0
})
});

alert("Transfer saved");

DATA=await api("/api/data");

loadTransfers();

}


function renderTransfers(){

let html="";

Object.keys(DATA.transfers||{})
.forEach(k=>{

html+=`
<div class="item">
<b>${k}</b><br>
${DATA.transfers[k]} SAR
</div>
`;

});

transferList.innerHTML=html;

}


/* VEHICLES */

async function addVehicle(){

let name=vehicleName.value.trim();

if(!name){

alert("Vehicle name kiriting");
return;

}

await api("/api/vehicles",{
method:"POST",
body:JSON.stringify({name})
});

alert("Vehicle added");

DATA=await api("/api/data");

loadTransfers();

renderVehicles();

vehicleName.value="";

}


function renderVehicles(){

vehicleList.innerHTML=
(DATA.vehicles||[])
.map(x=>`<div class="item">🚙 ${x}</div>`)
.join("");

}


/* BOOKINGS */

async function loadBookings(){

let list=await api("/api/bookings");

if(!list.length){

bookingList.innerHTML=
"<div class='item'>No bookings</div>";

return;

}

bookingList.innerHTML=list.map(b=>`

<div class="item">

<b>${b.name||"-"}</b><br>

Hotel: ${b.hotel||"-"}<br>
Room: ${b.roomType||"-"}<br>
Destination: ${b.destination||"-"}<br>

Check-in: ${b.checkin||"-"}<br>
Check-out: ${b.checkout||"-"}<br>

Phone: ${b.phone||"-"}<br>

Transfer: ${b.transferRoute||"No Transfer"}<br>
Vehicle: ${b.vehicle||"-"}<br>

Total: <b>${b.total||"0 SAR"}</b>

</div>

`).join("");

}

</script>

</body>
</html>
