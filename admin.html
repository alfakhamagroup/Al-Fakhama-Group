<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Fakhama Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f6f1e8;
color:#30271c;
}

header{
background:#211a12;
color:white;
padding:24px;
text-align:center;
}

.logo{
font-size:24px;
font-weight:bold;
letter-spacing:3px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:15px;
padding:22px;
margin-bottom:20px;
box-shadow:0 5px 20px #0001;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

label{
display:block;
font-weight:bold;
margin-top:5px;
}

input,select{
width:100%;
padding:13px;
margin-top:7px;
border:1px solid #d9cdbb;
border-radius:8px;
background:white;
}

.btn{
width:100%;
padding:14px;
margin-top:15px;
border:0;
border-radius:8px;
background:#ad8549;
color:white;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
opacity:.9;
}

.item{
background:#faf6ef;
border:1px solid #e4d8c5;
border-radius:10px;
padding:15px;
margin-top:10px;
}

.delete{
background:#a33;
color:white;
border:0;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
margin-top:8px;
}

.status{
padding:12px;
background:#eee3d1;
border-radius:8px;
margin-bottom:15px;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<div class="logo">AL FAKHAMA TRAVEL</div>
<div style="margin-top:8px">ADMIN PANEL</div>
</header>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
type="password"
id="password"
placeholder="Enter Admin Password"
>

<button class="btn" onclick="login()">
LOGIN
</button>

</div>


<!-- ADMIN CONTENT -->

<div id="adminContent" style="display:none">

<div class="status" id="status">
Connected to database
</div>


<!-- ================= HOTELS ================= -->

<div class="card">

<h2>🏨 Hotels</h2>

<div class="grid">

<div>
<label>Destination</label>

<select id="hotelDestination">

<option value="Madinah">
Madinah
</option>

<option value="Makkah">
Makkah
</option>

</select>
</div>


<div>
<label>Hotel Name</label>

<input
id="hotelName"
placeholder="Enter hotel name"
>
</div>


<div>
<label>Double Price</label>

<input
type="number"
id="hotelDouble"
placeholder="0"
>
</div>


<div>
<label>Triple Price</label>

<input
type="number"
id="hotelTriple"
placeholder="0"
>
</div>


<div>
<label>Quad Price</label>

<input
type="number"
id="hotelQuad"
placeholder="0"
>
</div>

</div>

<button
class="btn"
onclick="saveHotel()"
>
ADD / UPDATE HOTEL
</button>

<div id="hotelList"></div>

</div>



<!-- ================= ROOM TYPES ================= -->

<div class="card">

<h2>🛏️ Room Types</h2>

<div class="grid">

<div>

<label>Destination</label>

<select id="roomDestination">

<option value="Madinah">
Madinah
</option>

<option value="Makkah">
Makkah
</option>

</select>

</div>


<div>

<label>Hotel</label>

<select id="roomHotel">

<option value="">
Select Hotel
</option>

</select>

</div>


<div>

<label>Room Type Name</label>

<input
id="roomName"
placeholder="Junior Suite"
>

</div>


<div>

<label>Double Price</label>

<input
type="number"
id="roomDouble"
placeholder="0"
>

</div>


<div>

<label>Triple Price</label>

<input
type="number"
id="roomTriple"
placeholder="0"
>

</div>


<div>

<label>Quad Price</label>

<input
type="number"
id="roomQuad"
placeholder="0"
>

</div>

</div>

<button
class="btn"
onclick="saveRoom()"
>
ADD / UPDATE ROOM TYPE
</button>

<div id="roomList"></div>

</div>



<!-- ================= VIEWS ================= -->

<div class="card">

<h2>👁️ Room Views</h2>

<div class="grid">

<div>

<label>Destination</label>

<select id="viewDestination">

<option value="Madinah">
Madinah
</option>

<option value="Makkah">
Makkah
</option>

</select>

</div>


<div>

<label>Hotel</label>

<select id="viewHotel">

<option value="">
Select Hotel
</option>

</select>

</div>


<div>

<label>View Name</label>

<input
id="viewName"
placeholder="Haram View"
>

</div>


<div>

<label>Price</label>

<input
type="number"
id="viewPrice"
placeholder="0"
>

</div>

</div>

<button
class="btn"
onclick="saveView()"
>
ADD / UPDATE VIEW
</button>

<div id="viewList"></div>

</div>



<!-- ================= EXTRA BED ================= -->

<div class="card">

<h2>🛌 Extra Bed</h2>

<div class="grid">

<div>

<label>Destination</label>

<select id="extraDestination">

<option value="Madinah">
Madinah
</option>

<option value="Makkah">
Makkah
</option>

</select>

</div>


<div>

<label>Hotel</label>

<select id="extraHotel">

<option value="">
Select Hotel
</option>

</select>

</div>


<div>

<label>Extra Bed Price</label>

<input
type="number"
id="extraPrice"
placeholder="0"
>

</div>

</div>

<button
class="btn"
onclick="saveExtra()"
>
SAVE EXTRA BED
</button>

<div id="extraList"></div>

</div>



<!-- ================= TRANSFER ================= -->

<div class="card">

<h2>🚘 Transfer Routes</h2>

<div class="grid">

<div>

<label>Route</label>

<select id="transferRoute">

<option value="">
Select Route
</option>

</select>

</div>


<div>

<label>Vehicle</label>

<select id="transferVehicle">

<option value="">
Select Vehicle
</option>

</select>

</div>


<div>

<label>Price SAR</label>

<input
type="number"
id="transferPrice"
placeholder="0"
>

</div>

</div>

<button
class="btn"
onclick="saveTransfer()"
>
SAVE TRANSFER PRICE
</button>

<div id="transferList"></div>

</div>



<!-- ================= VEHICLES ================= -->

<div class="card">

<h2>🚙 Vehicles</h2>

<input
id="vehicleName"
placeholder="Mercedes S-Class 2026"
>

<button
class="btn"
onclick="addVehicle()"
>
ADD VEHICLE
</button>

<div id="vehicleList"></div>

</div>



<!-- ================= BOOKINGS ================= -->

<div class="card">

<h2>📋 Customer Bookings</h2>

<div id="bookingList">
Loading...
</div>

</div>


</div>

</div>


<script>

const API =
"https://al-fakhama-booking-new.alfakhama-travel-uzb.workers.dev";


let DATA = {};



/* ================= LOGIN ================= */

function login(){

const password =
document.getElementById("password").value;

if(password !== "ALFAKHAMA2026"){

alert("Wrong password");

return;

}

document.getElementById("loginBox")
.style.display="none";

document.getElementById("adminContent")
.style.display="block";

loadData();

}



/* ================= API ================= */

async function api(path,options={}){

const response =
await fetch(API+path,{

...options,

headers:{
"Content-Type":"application/json",
...(options.headers||{})
}

});

return await response.json();

}



/* ================= LOAD DATA ================= */

async function loadData(){

try{

DATA =
await api("/api/data");

renderAll();

loadBookings();

document.getElementById("status")
.innerText =
"✅ Connected to KV Database";

}catch(error){

console.error(error);

document.getElementById("status")
.innerText =
"❌ Database connection error";

}

}



/* ================= RENDER ALL ================= */

function renderAll(){

renderHotels();

renderRooms();

renderViews();

renderExtra();

renderTransfers();

renderVehicles();

loadHotelSelects();

loadRoutes();

}



/* ================= HOTEL SELECTS ================= */

function loadHotelSelects(){

fillHotels(
"roomHotel",
document.getElementById("roomDestination").value
);

fillHotels(
"viewHotel",
document.getElementById("viewDestination").value
);

fillHotels(
"extraHotel",
document.getElementById("extraDestination").value
);

}



function fillHotels(id,destination){

const select =
document.getElementById(id);

select.innerHTML =
'<option value="">Select Hotel</option>';

Object.keys(
DATA.hotels?.[destination] || {}
)
.forEach(hotel=>{

select.innerHTML +=
`
<option value="${hotel}">
${hotel}
</option>
`;

});

}



/* ================= HOTEL ================= */

async function saveHotel(){

const body={

destination:
document.getElementById("hotelDestination").value,

name:
document.getElementById("hotelName").value.trim(),

Double:
Number(
document.getElementById("hotelDouble").value
)||0,

Triple:
Number(
document.getElementById("hotelTriple").value
)||0,

Quad:
Number(
document.getElementById("hotelQuad").value
)||0

};


if(!body.name){

alert("Enter hotel name");

return;

}


const result =
await api("/api/hotels",{

method:"POST",

body:
JSON.stringify(body)

});


if(result.success){

alert("Hotel saved successfully");

DATA =
await api("/api/data");

renderAll();

}

}



/* ================= HOTEL LIST ================= */

function renderHotels(){

let html="";

Object.keys(DATA.hotels||{})
.forEach(destination=>{

Object.keys(
DATA.hotels[destination]||{}
)
.forEach(hotel=>{

const h =
DATA.hotels[destination][hotel];

html +=
`
<div class="item">

<b>
${destination} — ${hotel}
</b>

<p>
Double: ${h.Double} SAR<br>
Triple: ${h.Triple} SAR<br>
Quad: ${h.Quad} SAR
</p>

<button
class="delete"
onclick="deleteHotel(
'${destination}',
'${encodeURIComponent(hotel)}'
)"
>
DELETE
</button>

</div>
`;

});

});


document.getElementById("hotelList")
.innerHTML=html;

}



/* ================= DELETE HOTEL ================= */

async function deleteHotel(
destination,
encodedHotel
){

const hotel =
decodeURIComponent(encodedHotel);

if(!confirm(
"Delete "+hotel+"?"
))return;


await api("/api/hotels",{

method:"DELETE",

body:
JSON.stringify({

destination,
name:hotel

})

});


DATA =
await api("/api/data");

renderAll();

}



/* ================= ROOM TYPE ================= */

document.getElementById(
"roomDestination"
).onchange=()=>{

fillHotels(
"roomHotel",
document.getElementById(
"roomDestination"
).value
);

};



async function saveRoom(){

const body={

destination:
document.getElementById(
"roomDestination"
).value,

hotel:
document.getElementById(
"roomHotel"
).value,

name:
document.getElementById(
"roomName"
).value.trim(),

Double:
Number(
document.getElementById(
"roomDouble"
).value
)||0,

Triple:
Number(
document.getElementById(
"roomTriple"
).value
)||0,

Quad:
Number(
document.getElementById(
"roomQuad"
).value
)||0

};


if(!body.hotel){

alert("Select hotel");

return;

}


if(!body.name){

alert("Enter room type name");

return;

}


const result =
await api("/api/room-types",{

method:"POST",

body:
JSON.stringify(body)

});


if(result.success){

alert(
"Room Type saved successfully"
);

DATA =
await api("/api/data");

renderAll();

}

}



/* ================= ROOM LIST ================= */

function renderRooms(){

let html="";

Object.keys(
DATA.roomTypes||{}
)
.forEach(key=>{

(DATA.roomTypes[key]||[])
.forEach(room=>{

html +=
`
<div class="item">

<b>${key}</b>

<p>

Room Type:
<strong>
${room.name}
</strong>

<br>

Double:
${room.Double} SAR

<br>

Triple:
${room.Triple} SAR

<br>

Quad:
${room.Quad} SAR

</p>

</div>
`;

});

});


document.getElementById(
"roomList"
).innerHTML=html;

}



/* ================= VIEWS ================= */

document.getElementById(
"viewDestination"
).onchange=()=>{

fillHotels(
"viewHotel",
document.getElementById(
"viewDestination"
).value
);

};



async function saveView(){

const body={

destination:
document.getElementById(
"viewDestination"
).value,

hotel:
document.getElementById(
"viewHotel"
).value,

name:
document.getElementById(
"viewName"
).value.trim(),

price:
Number(
document.getElementById(
"viewPrice"
).value
)||0

};


if(!body.hotel){

alert("Select hotel");

return;

}


if(!body.name){

alert("Enter view name");

return;

}


await api("/api/views",{

method:"POST",

body:
JSON.stringify(body)

});


alert("View saved");

DATA =
await api("/api/data");

renderAll();

}



/* ================= VIEW LIST ================= */

function renderViews(){

let html="";

Object.keys(
DATA.views||{}
)
.forEach(key=>{

(DATA.views[key]||[])
.forEach(view=>{

html +=
`
<div class="item">

<b>${key}</b>

<p>
${view.name}
—
${view.price} SAR
</p>

</div>
`;

});

});


document.getElementById(
"viewList"
).innerHTML=html;

}



/* ================= EXTRA BED ================= */

document.getElementById(
"extraDestination"
).onchange=()=>{

fillHotels(
"extraHotel",
document.getElementById(
"extraDestination"
).value
);

};



async function saveExtra(){

const body={

destination:
document.getElementById(
"extraDestination"
).value,

hotel:
document.getElementById(
"extraHotel"
).value,

enabled:true,

price:
Number(
document.getElementById(
"extraPrice"
).value
)||0

};


if(!body.hotel){

alert("Select hotel");

return;

}


await api("/api/extra-beds",{

method:"POST",

body:
JSON.stringify(body)

});


alert("Extra Bed saved");

DATA =
await api("/api/data");

renderAll();

}



/* ================= EXTRA LIST ================= */

function renderExtra(){

let html="";

Object.keys(
DATA.extraBeds||{}
)
.forEach(key=>{

const x =
DATA.extraBeds[key];

html +=
`
<div class="item">

<b>${key}</b>

<p>
Extra Bed + Breakfast:
${x.price} SAR
</p>

</div>
`;

});


document.getElementById(
"extraList"
).innerHTML=html;

}



/* ================= TRANSFER ================= */

function loadRoutes(){

const routes=[];

Object.values(
DATA.routes||{}
)
.flat()
.forEach(route=>{

if(!routes.includes(route))
routes.push(route);

});


const select =
document.getElementById(
"transferRoute"
);

select.innerHTML =
'<option value="">Select Route</option>';


routes.forEach(route=>{

select.innerHTML +=
`
<option value="${route}">
${route}
</option>
`;

});


const vehicle =
document.getElementById(
"transferVehicle"
);

vehicle.innerHTML =
'<option value="">Select Vehicle</option>';


(DATA.vehicles||[])
.forEach(v=>{

vehicle.innerHTML +=
`
<option value="${v}">
${v}
</option>
`;

});

}



/* ================= SAVE TRANSFER ================= */

async function saveTransfer(){

const route =
document.getElementById(
"transferRoute"
).value;

const vehicle =
document.getElementById(
"transferVehicle"
).value;

const price =
Number(
document.getElementById(
"transferPrice"
).value
)||0;


if(!route){

alert("Select route");

return;

}


if(!vehicle){

alert("Select vehicle");

return;

}


await api("/api/transfers",{

method:"POST",

body:
JSON.stringify({

route,
vehicle,
price

})

});


alert(
"Transfer price saved"
);

DATA =
await api("/api/data");

renderAll();

}



/* ================= TRANSFER LIST ================= */

function renderTransfers(){

let html="";

Object.keys(
DATA.transfers||{}
)
.forEach(key=>{

html +=
`
<div class="item">

<b>
${key}
</b>

<p>
${DATA.transfers[key]} SAR
</p>

</div>
`;

});


document.getElementById(
"transferList"
).innerHTML=html;

}



/* ================= VEHICLES ================= */

async function addVehicle(){

const name =
document.getElementById(
"vehicleName"
).value.trim();


if(!name){

alert("Enter vehicle name");

return;

}


const result =
await api("/api/vehicles",{

method:"POST",

body:
JSON.stringify({

name

})

});


if(result.success){

alert(
"Vehicle added"
);

DATA =
await api("/api/data");

renderAll();

document.getElementById(
"vehicleName"
).value="";

}

}



/* ================= VEHICLE LIST ================= */

function renderVehicles(){

let html="";

(DATA.vehicles||[])
.forEach(vehicle=>{

html +=
`
<div class="item">
🚙 ${vehicle}
</div>
`;

});


document.getElementById(
"vehicleList"
).innerHTML=html;

}



/* ================= BOOKINGS ================= */

async function loadBookings(){

try{

const bookings =
await api("/api/bookings");


if(!bookings.length){

document.getElementById(
"bookingList"
).innerHTML =
"<p>No bookings yet.</p>";

return;

}


document.getElementById(
"bookingList"
).innerHTML =

bookings.map(
booking=>

`
<div class="item">

<h3>
${booking.name || "-"}
</h3>

<b>
Status:
${booking.status || "New"}
</b>

<hr>

Hotel:
${booking.hotel || "-"}
<br>

Destination:
${booking.destination || "-"}
<br>

Room:
${booking.roomType || "-"}
<br>

Check-in:
${booking.checkin || "-"}
<br>

Check-out:
${booking.checkout || "-"}
<br>

Phone:
${booking.phone || "-"}
<br>

Transfer:
${booking.transferRoute || "No Transfer"}
<br>

Vehicle:
${booking.vehicle || "-"}
<br>

Total:
<strong>
${booking.total || "0 SAR"}
</strong>

</div>
`

).join("");


}catch(error){

document.getElementById(
"bookingList"
).innerHTML =
"Unable to load bookings.";

}

}

</script>

</body>
</html>
